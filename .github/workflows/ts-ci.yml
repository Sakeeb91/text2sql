name: TypeScript CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'issue/**'
  pull_request:
    branches:
      - main
      - develop

env:
  PNPM_VERSION: 8.15.1
  NODE_VERSION: 20

jobs:
  ts-code-quality:
    name: TypeScript Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint NestJS backend
        run: pnpm ts:lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check backend
        run: pnpm ts:type-check

  ts-test-matrix:
    name: Vitest Suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm ts:test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-ci' }}

  ts-coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: ts-test-matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm ts:test:coverage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-ci' }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage-report
          path: coverage/typescript/backend
          retention-days: 7

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/typescript/backend/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: typescript
          name: ts-backend
        continue-on-error: true

  ts-build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm ts:build

  ts-database-integrity:
    name: Database Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate env templates
        run: pnpm ts:env:validate

  ts-performance-check:
    name: Performance Smoke Test
    runs-on: ubuntu-latest
    needs: ts-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm ts:build

      - name: Start backend in background
        run: |
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-ci' }} \
          DATABASE_URL=sqlite:///./data/database.db \
          PORT=4010 pnpm --filter @text2sql/backend start:prod &
          echo $! > backend.pid
          sleep 10

      - name: Hit health endpoint
        run: curl --fail http://localhost:4010/health

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi

  ts-security-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --prod

  ts-pr-summary:
    name: TypeScript CI Summary
    runs-on: ubuntu-latest
    needs:
      - ts-code-quality
      - ts-test-matrix
      - ts-build
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `## 🧪 TypeScript CI

            - Code Quality: ${{ needs['ts-code-quality'].result }}
            - Tests: ${{ needs['ts-test-matrix'].result }}
            - Build: ${{ needs['ts-build'].result }}

            Full logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  ts-required:
    name: TypeScript Required Checks
    runs-on: ubuntu-latest
    needs:
      - ts-code-quality
      - ts-test-matrix
      - ts-build
    if: always()

    steps:
      - name: Verify required jobs succeeded
        run: |
          if [[ "${{ needs['ts-code-quality'].result }}" != 'success' ]]; then
            echo 'Code quality checks failed'
            exit 1
          fi
          if [[ "${{ needs['ts-test-matrix'].result }}" != 'success' ]]; then
            echo 'Test matrix failed'
            exit 1
          fi
          if [[ "${{ needs['ts-build'].result }}" != 'success' ]]; then
            echo 'Build verification failed'
            exit 1
          fi
          echo 'All required TypeScript jobs passed.'
