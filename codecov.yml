codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 85%
        threshold: 1%
        base: auto
        if_ci_failed: error

    patch:
      default:
        target: 85%
        threshold: 5%
        base: auto

  ignore:
    - "tests/**/*"
    - "docs/**/*"
    - "**/__pycache__/**"
    - "**/migrations/**"

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes
  branches:
    - main

github_checks:
  annotations: true
